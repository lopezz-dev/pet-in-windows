# Push a tag like v0.2.0 -> builds the Windows installer and attaches it to a
# draft GitHub Release. Review the draft and click "Publish".
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Pet in Windows ${{ github.ref_name }}
          releaseBody: |
            Descarga `Pet.in.Windows_*_x64-setup.exe`, instálalo y abre una conversación de Claude Code.

            Windows SmartScreen avisará de «editor desconocido» (el instalador aún no está firmado):
            **Más información → Ejecutar de todas formas**.
          releaseDraft: true
          prerelease: false
