# Push a tag like v0.2.0 -> builds the Windows installer and attaches it to a
# draft GitHub Release. Review the draft and click "Publish".
#
# Actions are pinned to commit SHAs (Dependabot keeps them updated) and the
# release job uses no build cache, so a poisoned cache can't reach the installer.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - run: npm ci

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Pet in Windows ${{ github.ref_name }}
          releaseBody: |
            Descarga `Pet.in.Windows_*_x64-setup.exe`, instálalo y abre una conversación de Claude Code.

            Windows SmartScreen avisará de «editor desconocido» (el instalador aún no está firmado):
            **Más información → Ejecutar de todas formas**.
          releaseDraft: true
          prerelease: false
